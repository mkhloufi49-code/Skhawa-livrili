
<script>
(() => {
"use strict";

const STORAGE_KEY = "skhawa_livrili_loyalty_v1";
let customers = [];
let transactions = [];
const $ = id => document.getElementById(id);

const safe = value => String(value ?? "").replace(/[&<>"']/g, ch => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[ch]));

const money = n => (Number(n)||0).toLocaleString("fr-MA", {
  maximumFractionDigits:2
}) + " DH";

function makeId() {
  return globalThis.crypto?.randomUUID?.() ||
    String(Date.now()) + Math.random().toString(16).slice(2);
}

function normalizeCustomer(c) {
  return {
    ...c,
    deliveries:Math.max(0,Number(c.deliveries)||0),
    paidSinceFree:Math.max(0,Math.min(10,Number(c.paidSinceFree)||0)),
    freeDeliveries:Math.max(0,Number(c.freeDeliveries)||0),
    doubleFreeCredits:Math.max(0,Number(c.doubleFreeCredits)||0),
    milestone50Claimed:Boolean(c.milestone50Claimed),
    category:["vip","regular","passage"].includes(c.category)
      ? c.category : "regular",
    giftEligible:typeof c.giftEligible === "boolean"
      ? c.giftEligible : c.category !== "passage",
    history:Array.isArray(c.history)?c.history:[]
  };
}

function loadData() {
  try {
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return;
    const data=JSON.parse(raw);
    if(Array.isArray(data.customers))
      customers=data.customers.map(normalizeCustomer);
    if(Array.isArray(data.transactions))transactions=data.transactions;
  } catch(error) {
    console.error(error);
    alert("ما قدرناش نقراو البيانات. ما تمسح والو وجرب النسخة الاحتياطية.");
  }
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY,JSON.stringify({customers,transactions}));
    return true;
  } catch(error) {
    alert("ما قدرناش نحفظو البيانات. حمّل نسخة احتياطية.");
    return false;
  }
}

function addTransaction(type,amount,note,customerId=null) {
  const t={
    id:makeId(),type,amount:Number(amount)||0,note:note||"",
    customerId,date:new Date().toISOString()
  };
  transactions.unshift(t);
  return t.id;
}

function paidCount(c) {
  return Math.max(0,Math.min(10,Number(c.paidSinceFree)||0));
}

function categoryName(c) {
  return ({
    vip:"👑 Client VIP",
    regular:"🧡 Client Régulier",
    passage:"Client Passage"
  })[c.category] || "Client Régulier";
}

function categoryColor(c) {
  return c.category==="vip" ? "#ffbd52" :
    c.category==="passage" ? "#b5b5bd" : "#ff8a26";
}

function injectControls() {
  // اختيار فئة الزبون عند التسجيل
  const source=$("customerSource");
  if(source && !$("customerCategory")) {
    source.parentElement.insertAdjacentHTML("afterend",`
      <div>
        <label for="customerCategory">فئة الزبون</label>
        <select id="customerCategory">
          <option value="regular">Client Régulier</option>
          <option value="vip">👑 Client VIP</option>
          <option value="passage">Client Passage</option>
        </select>
      </div>`);
  }

  // فلاتر إضافية، مع الاحتفاظ بالفلاتر القديمة
  const filter=$("filter");
  if(filter && !$("categoryFilterOptions")) {
    const marker=document.createElement("optgroup");
    marker.id="categoryFilterOptions";
    marker.label="فئات الزبناء";
    marker.innerHTML=`
      <option value="vip">👑 VIP</option>
      <option value="regular">Client Régulier</option>
      <option value="passage">Client Passage</option>
      <option value="ineligible">غير مؤهل للهدايا</option>`;
    filter.appendChild(marker);
  }
}

function recordDelivery(id) {
  const c=customers.find(x=>String(x.id)===String(id));
  if(!c)return;

  let type="paid", price=0;

  if(c.category==="passage" || !c.giftEligible) {
    // الزبون غير المؤهل ما ياخدش الهدية العادية أوتوماتيكياً.
    if((Number(c.doubleFreeCredits)||0)>0) {
      if(confirm("عندو مكافأة 50 توصيل. واش تستعملها لهاد التوصيلة؟"))
        type="bonus";
    }

    if(type==="paid") {
      const answer=prompt(
        "هاد الزبون غير مؤهل للهدايا الأوتوماتيكية.\n"+
        "دخل ثمن التوصيلة المؤدى عنها، أو ألغِ العملية."
      );
      if(answer===null)return;
      if(answer.trim()==="" || !Number.isFinite(Number(answer)) || Number(answer)<0) {
        alert("دخل ثمن صحيح."); return;
      }
      price=Number(answer);
    }
  } else {
    if((Number(c.doubleFreeCredits)||0)>0) {
      if(confirm("عندو "+c.doubleFreeCredits+
        " توصيلات مجانية من مكافأة 50. واش تستعمل وحدة؟"))
        type="bonus";
    }
    if(type==="paid" && paidCount(c)>=10)type="free";

    if(type==="paid") {
      const answer=prompt("شحال خلص الزبون على التوصيلة؟","15");
      if(answer===null)return;
      if(answer.trim()==="" || !Number.isFinite(Number(answer)) || Number(answer)<0) {
        alert("دخل ثمن صحيح."); return;
      }
      price=Number(answer);
    }
  }

  // هدية استثنائية بقرار الإدارة
  if(type==="paid" && confirm("واش بغيتي تمنح هاد الزبون توصيل فابور استثنائي؟")) {
    type="gift";
  }

  const msg={
    paid:"تأكيد توصيل مدفوع بثمن "+money(price)+"؟",
    free:"تأكيد الهدية العادية المجانية؟",
    bonus:"تأكيد استعمال توصيل مجاني من مكافأة 50؟",
    gift:"تأكيد الهدية الاستثنائية؟"
  };

  if(!confirm(msg[type]))return;

  const now=new Date().toISOString();
  c.history=Array.isArray(c.history)?c.history:[];

  const event={
    id:makeId(),type,date:now,amount:type==="paid"?price:0
  };

  c.deliveries=(Number(c.deliveries)||0)+1;

  if(type==="paid") {
    c.paidSinceFree=paidCount(c)+1;
    if(price>0) {
      event.transactionId=addTransaction(
        "income",price,"توصيلة مدفوعة: "+c.name,c.id
      );
    }
  } else if(type==="free") {
    c.paidSinceFree=0;
    c.freeDeliveries=(Number(c.freeDeliveries)||0)+1;
  } else if(type==="bonus") {
    c.doubleFreeCredits=Math.max(0,(Number(c.doubleFreeCredits)||0)-1);
    c.freeDeliveries=(Number(c.freeDeliveries)||0)+1;
  } else if(type==="gift") {
    c.freeDeliveries=(Number(c.freeDeliveries)||0)+1;
  }

  c.history.unshift(event);

  if(c.deliveries>=50 && !c.milestone50Claimed) {
    c.milestone50Claimed=true;
    c.doubleFreeCredits=(Number(c.doubleFreeCredits)||0)+2;
    alert("🏆 وصل لـ50 توصيل! تزادو ليه جوج توصيلات مجانية.");
  } else {
    alert("تسجلات التوصيلة بنجاح 🧡");
  }

  saveData();
  renderAll();
}

function undoLastDelivery(id) {
  const c=customers.find(x=>String(x.id)===String(id));
  if(!c)return;

  if(!c.history.length) {
    alert("ما كاينش سجل مفصل للتوصيلات القديمة ديال هاد الزبون، لذلك ما نقدرش نصحح آخر توصيلة بأمان.");
    return;
  }

  const last=c.history[0];
  const type=last.type;

  if(!confirm(
    "واش متأكد بغيتي تلغي آخر توصيلة ديال "+c.name+"؟\n"+
    "نوعها: "+({
      paid:"مدفوعة",free:"هدية عادية",
      bonus:"مكافأة 50",gift:"هدية استثنائية"
    }[type]||type)+"\n\nغادي يتصحح عدد التوصيلات."
  ))return;

  if(type==="paid") {
    // نحيدو الحركة المالية المرتبطة بها إلا كان المعرّف متوفر.
    if(last.transactionId) {
      transactions=transactions.filter(t=>t.id!==last.transactionId);
    } else {
      const index=transactions.findIndex(t=>
        t.type==="income" && String(t.customerId)===String(c.id) &&
        String(t.note||"").includes(c.name)
      );
      if(index!==-1)transactions.splice(index,1);
    }

    c.paidSinceFree=Math.max(0,paidCount(c)-1);
  } else if(type==="free") {
    c.paidSinceFree=10;
    c.freeDeliveries=Math.max(0,(Number(c.freeDeliveries)||0)-1);
  } else if(type==="bonus") {
    c.doubleFreeCredits=(Number(c.doubleFreeCredits)||0)+1;
    c.freeDeliveries=Math.max(0,(Number(c.freeDeliveries)||0)-1);
  } else if(type==="gift") {
    c.freeDeliveries=Math.max(0,(Number(c.freeDeliveries)||0)-1);
  }

  c.history.shift();
  c.deliveries=Math.max(0,(Number(c.deliveries)||0)-1);

  saveData();
  renderAll();
  alert("تصلحات آخر توصيلة. راجع رصيد الهدايا إذا كان الزبون وصل لـ50 توصيل من قبل.");
}

function changeCategory(id) {
  const c=customers.find(x=>String(x.id)===String(id));
  if(!c)return;

  const answer=prompt(
    "اختار فئة الزبون بكتابة الرقم:\n"+
    "1 = Client VIP\n2 = Client Régulier\n3 = Client Passage",
    c.category==="vip"?"1":c.category==="passage"?"3":"2"
  );
  if(answer===null)return;

  const categories={"1":"vip","2":"regular","3":"passage"};
  if(!categories[answer.trim()]) {
    alert("اختيار غير صحيح.");return;
  }

  const oldCategory=c.category;
  c.category=categories[answer.trim()];

  if(c.category==="passage") {
    c.giftEligible=false;
  } else if(oldCategory==="passage") {
    c.giftEligible=true;
  }

  if(!saveData())return;
  renderAll();
}

function toggleGiftEligibility(id) {
  const c=customers.find(x=>String(x.id)===String(id));
  if(!c)return;

  const next=!c.giftEligible;
  if(!confirm(next
    ?"واش بغيتي تخلي "+c.name+" مؤهل للهدايا الأوتوماتيكية؟"
    :"واش بغيتي توقف أهلية "+c.name+" للهدايا الأوتوماتيكية؟"
  ))return;

  c.giftEligible=next;
  if(!saveData())return;
  renderAll();
}

function giveManualGift(id) {
  const c=customers.find(x=>String(x.id)===String(id));
  if(!c)return;

  if(!confirm("منح توصيل فابور استثنائي لـ "+c.name+"؟"))return;

  c.deliveries=(Number(c.deliveries)||0)+1;
  c.freeDeliveries=(Number(c.freeDeliveries)||0)+1;
  c.history.unshift({
    id:makeId(),type:"gift",date:new Date().toISOString(),amount:0
  });

  saveData();
  renderAll();
  alert("تسجلات الهدية الاستثنائية 🎁");
}

function editCustomer(id) {
  const c=customers.find(x=>String(x.id)===String(id));
  if(!c)return;

  const name=prompt("الاسم الجديد:",c.name);
  if(name===null||!name.trim())return;
  const phone=prompt("رقم الهاتف:",c.phone);
  if(phone===null||!phone.trim())return;

  const normalized=phone.replace(/\s/g,"");
  if(customers.some(x=>String(x.id)!==String(id)&&
    String(x.phone||"").replace(/\s/g,"")===normalized)) {
    alert("هاد الرقم مستعمل عند زبون آخر.");return;
  }

  c.name=name.trim();
  c.phone=phone.trim();
  saveData();
  renderAll();
}

function deleteCustomer(id) {
  const c=customers.find(x=>String(x.id)===String(id));
  if(!c)return;
  if(!confirm("واش متأكد بغيتي تمسح الزبون "+c.name+"؟"))return;
  customers=customers.filter(x=>String(x.id)!==String(id));
  saveData();
  renderAll();
}

function customerHTML(c) {
  const paid=paidCount(c);
  const remaining=Math.max(0,10-paid);
  const giftReady=paid>=10 && c.giftEligible && c.category!=="passage";
  const progress=giftReady?100:paid*10;

  let tag=`<span class="tag" style="color:${categoryColor(c)}">${safe(categoryName(c))}</span>`;
  if(!c.giftEligible || c.category==="passage") {
    tag+=` <span class="tag neutral">الهدايا يدوياً</span>`;
  } else if(giftReady) {
    tag+=` <span class="tag ready">🎁 هدية واجدة</span>`;
  }

  let giftText;
  if(!c.giftEligible || c.category==="passage") {
    giftText="الهدايا غير بقرار الإدارة";
  } else if(giftReady) {
    giftText="🎁 التوصيلة الجاية مجانية";
  } else if(remaining===3) {
    giftText="⚡ بقاو غير 3 توصيلات للهدية!";
  } else {
    giftText="باقي "+remaining+" توصيلات للهدية";
  }

  if(Number(c.doubleFreeCredits)>0)
    giftText+=" · "+Number(c.doubleFreeCredits)+" هدايا إضافية";

  return `
  <article class="customer">
    <div class="customer-top">
      <div class="avatar">${c.category==="vip"?"👑":"♙"}</div>
      <div class="customer-main">
        <h3>${safe(c.name)}</h3>
        <div class="phone">${safe(c.phone||"")}</div>
        <div class="customer-sub">طريقة الطلب: ${safe(c.source||"غير محددة")}</div>
      </div>
      ${tag}
    </div>
    <div class="progress-info">
      <span>التقدم نحو الهدية</span>
      <strong class="${giftReady?"green":"orange"}">${paid} / 10</strong>
    </div>
    <div class="progress"><div style="width:${progress}%"></div></div>
    <div class="gift ${giftReady?"ready":""}">${safe(giftText)}</div>
    <div class="customer-stats">
      <div class="mini-stat"><small>مجموع التوصيلات</small><strong>${Number(c.deliveries)||0}</strong></div>
      <div class="mini-stat"><small>الهدايا المستافد منها</small><strong>${Number(c.freeDeliveries)||0}</strong></div>
    </div>
    <div class="customer-bottom">
      <button class="btn btn-primary btn-small" data-action="deliver" data-id="${safe(c.id)}">＋ توصيل</button>
      <button class="btn btn-outline btn-small" data-action="undo" data-id="${safe(c.id)}">− إلغاء آخر توصيلة</button>
      <button class="btn btn-outline btn-small" data-action="category" data-id="${safe(c.id)}">تغيير الفئة</button>
      <button class="btn btn-outline btn-small" data-action="eligibility" data-id="${safe(c.id)}">${c.giftEligible?"توقيف الهدايا":"تفعيل الهدايا"}</button>
      <button class="btn btn-outline btn-small" data-action="gift" data-id="${safe(c.id)}">🎁 هدية استثنائية</button>
      <button class="btn btn-outline btn-small" data-action="edit" data-id="${safe(c.id)}">تعديل</button>
      <button class="btn btn-danger btn-small" data-action="delete" data-id="${safe(c.id)}">مسح</button>
    </div>
  </article>`;
}

function renderCustomers() {
  const query=($("search").value||"").trim().toLowerCase();
  const filter=$("filter").value;

  const filtered=customers.filter(c=>{
    const matches=String(c.name||"").toLowerCase().includes(query)||
      String(c.phone||"").toLowerCase().includes(query);
    if(!matches)return false;
    if(filter==="near")return paidCount(c)===7 && c.giftEligible;
    if(filter==="ready")return paidCount(c)>=10 && c.giftEligible && c.category!=="passage";
    if(filter==="bonus")return Number(c.doubleFreeCredits)>0;
    if(filter==="vip")return c.category==="vip";
    if(filter==="regular")return c.category==="regular";
    if(filter==="passage")return c.category==="passage";
    if(filter==="ineligible")return !c.giftEligible;
    return true;
  });

  // الترتيب من الأكثر توصيلات للأقل
  filtered.sort((a,b)=>(Number(b.deliveries)||0)-(Number(a.deliveries)||0));

  $("customerList").innerHTML=filtered.length
    ?filtered.map(customerHTML).join("")
    :'<div class="empty">ما لقينا حتى زبون مطابق.<br>جرب البحث من جديد أو زيد زبون جديد.</div>';

  const recent=[...customers]
    .sort((a,b)=>(Number(b.deliveries)||0)-(Number(a.deliveries)||0))
    .slice(0,2);

  $("recentCustomers").innerHTML=recent.length
    ?recent.map(customerHTML).join("")
    :'<div class="empty">مازال ما تسجل حتى زبون.<br>زيد أول زبون من قسم الزبناء.</div>';
}

function renderFinance() {
  const income=transactions.filter(t=>t.type==="income")
    .reduce((sum,t)=>sum+(Number(t.amount)||0),0);
  const expenses=transactions.filter(t=>t.type==="expense")
    .reduce((sum,t)=>sum+(Number(t.amount)||0),0);

  $("sCustomers").textContent=customers.length;
  $("sDeliveries").textContent=customers.reduce((sum,c)=>sum+(Number(c.deliveries)||0),0);
  $("sIncome").textContent=money(income);
  $("sExpenses").textContent=money(expenses);
  $("sBalance").textContent=money(income-expenses);

  const reminders=customers.filter(c=>paidCount(c)===7 && c.giftEligible);
  const bonusCustomers=customers.filter(c=>Number(c.doubleFreeCredits)>0);

  let notices="";
  if(reminders.length) {
    notices+=`<div class="notice">⚡ <strong>تذكير الوفاء:</strong> ${reminders.length} زبون بقاو ليهم 3 توصيلات: ${reminders.map(c=>safe(c.name)).join("، ")}</div>`;
  }
  if(bonusCustomers.length) {
    notices+=`<div class="notice">🎁 <strong>هدايا إضافية:</strong> ${bonusCustomers.map(c=>safe(c.name)+" ("+Number(c.doubleFreeCredits)+")").join("، ")}</div>`;
  }
  $("dashboardNotice").innerHTML=notices;

  $("transactionList").innerHTML=transactions.length
    ?transactions.slice(0,100).map(t=>`
      <div class="transaction">
        <div><strong>${safe(t.note||(t.type==="income"?"مدخول":"مصروف"))}</strong>
        <small>${safe(t.date?new Date(t.date).toLocaleString("fr-MA"):"")}</small></div>
        <div class="amount ${t.type==="income"?"green":"red"}">${t.type==="income"?"+":"−"}${money(t.amount)}</div>
      </div>`).join("")
    :'<div class="empty">ما تسجل حتى حركة مالية.</div>';
}

function renderAll() {
  renderCustomers();
  renderFinance();
}

injectControls();

$("customerForm").addEventListener("submit",event=>{
  event.preventDefault();
  const name=$("customerName").value.trim();
  const phone=$("customerPhone").value.trim();
  if(!name||!phone)return;

  const normalized=phone.replace(/\s/g,"");
  if(customers.some(c=>String(c.phone||"").replace(/\s/g,"")===normalized)) {
    alert("هاد الرقم مسجل من قبل.");return;
  }

  const category=$("customerCategory")?.value||"regular";
  customers.push({
    id:makeId(),name,phone,source:$("customerSource").value,
    category,giftEligible:category!=="passage",
    deliveries:0,paidSinceFree:0,freeDeliveries:0,
    doubleFreeCredits:0,milestone50Claimed:false,
    history:[],createdAt:new Date().toISOString()
  });

  if(!saveData())return;
  $("customerForm").reset();
  renderAll();
  alert("تسجل الزبون بنجاح 🧡");
});

function handleCustomerAction(event) {
  const btn=event.target.closest("button[data-action]");
  if(!btn)return;
  const {action,id}=btn.dataset;

  if(action==="deliver")recordDelivery(id);
  if(action==="undo")undoLastDelivery(id);
  if(action==="category")changeCategory(id);
  if(action==="eligibility")toggleGiftEligibility(id);
  if(action==="gift")giveManualGift(id);
  if(action==="edit")editCustomer(id);
  if(action==="delete")deleteCustomer(id);
}

$("customerList").addEventListener("click",handleCustomerAction);
$("recentCustomers").addEventListener("click",handleCustomerAction);
$("search").addEventListener("input",renderCustomers);
$("filter").addEventListener("change",renderCustomers);

$("financeForm").addEventListener("submit",event=>{
  event.preventDefault();
  const amount=Number($("financeAmount").value);
  if(!Number.isFinite(amount)||amount<=0) {
    alert("دخل مبلغ صحيح.");return;
  }

  const type=$("financeType").value;
  addTransaction(type,amount,$("financeNote").value.trim()||
    (type==="income"?"مدخول إضافي":"مصروف"));

  if(!saveData())return;
  $("financeForm").reset();
  renderAll();
  alert("تسجلات الحركة المالية.");
});

function goToPage(page) {
  document.querySelectorAll(".bottom-nav button").forEach(b=>
    b.classList.toggle("active",b.dataset.page===page));
  document.querySelectorAll(".page").forEach(p=>
    p.classList.toggle("active",p.id===page));
  window.scrollTo({top:0,behavior:"smooth"});
}

document.querySelectorAll(".bottom-nav button").forEach(button=>{
  button.addEventListener("click",()=>goToPage(button.dataset.page));
});
document.querySelectorAll("[data-goto]").forEach(button=>{
  button.addEventListener("click",()=>goToPage(button.dataset.goto));
});

$("exportBtn").addEventListener("click",()=>{
  const blob=new Blob([JSON.stringify({customers,transactions},null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="SKHAWA-LIVRILI-backup-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
});

$("importBtn").addEventListener("click",()=>$("importFile").click());
$("importFile").addEventListener("change",async event=>{
  const file=event.target.files[0];
  if(!file)return;
  try {
    const data=JSON.parse(await file.text());
    if(!Array.isArray(data.customers)||!Array.isArray(data.transactions))
      throw new Error("صيغة غير صحيحة");

    if(!confirm("استرجاع النسخة غادي يعوض البيانات الحالية. متأكد؟"))return;
    customers=data.customers.map(normalizeCustomer);
    transactions=data.transactions;
    if(!saveData())return;
    renderAll();
    alert("ترجعات النسخة الاحتياطية بنجاح.");
  } catch(error) {
    alert("الملف ما صالحش أو ما قدرناش نقراوه.");
  } finally {
    event.target.value="";
  }
});

loadData();
renderAll();
})();
</script>
